const Utils = (() => {
  const sleep = (ms) => new Promise((res) => setTimeout(res, ms));

  const escapeHtml = (str) =>
    String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

  const levenshtein = (a, b) => {
    const m = a.length, n = b.length;
    const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
    for (let j = 0; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        d[i][j] = a[i - 1] === b[j - 1]
          ? d[i - 1][j - 1]
          : 1 + Math.min(d[i - 1][j], d[i][j - 1], d[i - 1][j - 1]);
      }
    }
    return d[m][n];
  };

  const formatUptime = (ms) => {
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return `${h}h ${String(m).padStart(2,"0")}m ${String(sec).padStart(2,"0")}s`;
    if (m > 0) return `${m}m ${String(sec).padStart(2,"0")}s`;
    return `${sec}s`;
  };

  const copyToClipboard = async (text) => {
    try { await navigator.clipboard.writeText(text); return true; } catch { return false; }
  };

  const randomOf = (arr) => arr[Math.floor(Math.random() * arr.length)];

  return { sleep, escapeHtml, levenshtein, formatUptime, copyToClipboard, randomOf };
})();

/* =====================================================================
   MODULE: VFS (Virtual File System)
   Builds and owns the directory tree. Every node is either:
     { type:'dir', children:{ name: node, ... } }
     { type:'file', kind:'text'|'render'|'binary', ... }
   ===================================================================== */
const VFS = (() => {
  const D = PortfolioData;

  const textFile = (title, lines) => ({ type: "file", kind: "text", title, lines });
  const renderFile = (render) => ({ type: "file", kind: "render", render });
  const binaryFile = (hint) => ({ type: "file", kind: "binary", hint });
  const dir = (children) => ({ type: "dir", children });

  const aboutDir = dir({
    "about.txt":   textFile("About", D.about.intro),
    "journey.txt": textFile("My DevOps Journey", D.about.journey),
    "mission.txt": textFile("Mission", D.about.mission),
    "career.txt":  textFile("Career Objective", D.about.career),
  });

  const skillsDir = dir({
    "cloud.txt":       renderFile((path) => Renderers.skillFileBlock(path, D.skillFiles.cloud)),
    "devops.txt":      renderFile((path) => Renderers.skillFileBlock(path, D.skillFiles.devops)),
    "programming.txt": renderFile((path) => Renderers.skillFileBlock(path, D.skillFiles.programming)),
    "tools.txt":       renderFile((path) => Renderers.skillFileBlock(path, D.skillFiles.tools)),
  });

  const expBySlug = Object.fromEntries(D.experience.map((e) => [e.slug, e]));
  const experienceDir = dir({
    "benchmarrk.txt":       renderFile((path) => Renderers.experienceFileBlock(path, expBySlug["benchmarrk"])),
    "virtual-softech.txt":  renderFile((path) => Renderers.experienceFileBlock(path, expBySlug["virtual-softech"])),
    "senthuron-tech.txt":   renderFile((path) => Renderers.experienceFileBlock(path, expBySlug["senthuron-tech"])),
  });

  const eduBySlug = Object.fromEntries(D.education.map((e) => [e.slug, e]));
  const educationDir = dir({
    "mtech.txt": renderFile((path) => Renderers.educationFileBlock(path, eduBySlug["mtech"])),
    "hsc.txt":   renderFile((path) => Renderers.educationFileBlock(path, eduBySlug["hsc"])),
    "sslc.txt":  renderFile((path) => Renderers.educationFileBlock(path, eduBySlug["sslc"])),
  });

  const projBySlug = Object.fromEntries(D.projects.map((p) => [p.slug, p]));
  const projectsDir = dir({
    "devsecops.txt":    renderFile((path) => Renderers.projectDetailBlock(projBySlug["devsecops"], path)),
    "aws.txt":           renderFile((path) => Renderers.projectDetailBlock(projBySlug["aws"], path)),
    "monitoring.txt":    renderFile((path) => Renderers.projectDetailBlock(projBySlug["monitoring"], path)),
    "microservices.txt": renderFile((path) => Renderers.projectDetailBlock(projBySlug["microservices"], path)),
    "frontend.txt":      renderFile((path) => Renderers.projectDetailBlock(projBySlug["frontend"], path)),
  });

  const portfolioDir = dir({
    "about": aboutDir,
    "skills": skillsDir,
    "experience": experienceDir,
    "education": educationDir,
    "projects": projectsDir,
    "resume.pdf": binaryFile("Use the 'resume' command to download it."),
    "contact.txt": renderFile(() => Renderers.contactBlock()),
  });

  const root = dir({
    home: dir({
      harish: dir({
        portfolio: portfolioDir,
      }),
    }),
  });

  const HOME = ["home", "harish"];
  const DEFAULT_CWD = ["home", "harish", "portfolio"];

  const getNode = (segments) => {
    let node = root;
    for (const seg of segments) {
      if (node.type !== "dir" || !node.children[seg]) return null;
      node = node.children[seg];
    }
    return node;
  };

  const listChildren = (node) => (node && node.type === "dir" ? Object.keys(node.children) : []);

  return { root, HOME, DEFAULT_CWD, getNode, listChildren };
})();

/* =====================================================================
   MODULE: PATH RESOLVER
   Turns a user-typed path string (relative, absolute, ~, ..) into an
   absolute segment array, and formats segment arrays back into
   human-readable display paths (with ~ substitution for the prompt).
   ===================================================================== */
const PathResolver = (() => {
  const isPrefixOf = (prefix, arr) => prefix.length <= arr.length && prefix.every((s, i) => arr[i] === s);

  function resolve(cwd, inputPath) {
    if (inputPath == null || inputPath === "") return cwd.slice();
    if (inputPath === "~") return VFS.HOME.slice();

    let base, rest;
    if (inputPath.startsWith("~/")) { base = VFS.HOME.slice(); rest = inputPath.slice(2); }
    else if (inputPath.startsWith("/")) { base = []; rest = inputPath.slice(1); }
    else { base = cwd.slice(); rest = inputPath; }

    const parts = rest.split("/").filter((p) => p !== "");
    for (const part of parts) {
      if (part === ".") continue;
      else if (part === "..") { if (base.length > 0) base.pop(); }
      else base.push(part);
    }
    return base;
  }

  function display(segments) {
    if (segments.length === 0) return "/";
    if (segments.join("/") === VFS.HOME.join("/")) return "~";
    if (isPrefixOf(VFS.HOME, segments)) {
      const rest = segments.slice(VFS.HOME.length);
      return "~" + (rest.length ? "/" + rest.join("/") : "");
    }
    return "/" + segments.join("/");
  }

  const absolute = (segments) => "/" + segments.join("/");

  return { resolve, display, absolute };
})();

/* =====================================================================
   MODULE: FILE READER
   Turns a resolved file node into printable HTML, or a Linux-style
   error string when the target isn't a readable regular file.
   ===================================================================== */
const FileReader_ = (() => {
  const esc = Utils.escapeHtml;

  function read(node, displayPath) {
    if (node.kind === "text") {
      return `<div class="out">${Renderers.fileHeader(displayPath)}<p>${node.lines.map(esc).join("<br>")}</p></div>`;
    }
    if (node.kind === "render") {
      return node.render(displayPath);
    }
    return null; // binary handled by caller
  }

  return { read };
})();

/* =====================================================================
   MODULE: DIRECTORY NAVIGATOR
   Owns `cwd` and implements pwd / ls / cd / tree / cat against the VFS,
   producing authentic bash-style output and errors.
   ===================================================================== */
class DirectoryNavigator {
  constructor() {
    this.cwd = VFS.DEFAULT_CWD.slice();
  }

  promptPath() { return PathResolver.display(this.cwd); }

  pwd() {
    return `<div class="out">${PathResolver.absolute(this.cwd)}</div>`;
  }

  cd(arg) {
    if (!arg) { this.cwd = VFS.HOME.slice(); return null; }
    if (arg === "-") { return `<div class="out c-red">bash: cd: OLDPWD not set</div>`; }
    const target = PathResolver.resolve(this.cwd, arg);
    const node = VFS.getNode(target);
    if (!node) return `<div class="out c-red">bash: cd: ${Utils.escapeHtml(arg)}: No such file or directory</div>`;
    if (node.type !== "dir") return `<div class="out c-red">bash: cd: ${Utils.escapeHtml(arg)}: Not a directory</div>`;
    this.cwd = target;
    return null;
  }

  ls(arg) {
    const target = arg ? PathResolver.resolve(this.cwd, arg) : this.cwd;
    const node = VFS.getNode(target);
    if (!node) return `<div class="out c-red">ls: cannot access '${Utils.escapeHtml(arg)}': No such file or directory</div>`;
    if (node.type === "file") {
      const name = arg.split("/").filter(Boolean).pop();
      return `<div class="out">${Utils.escapeHtml(name)}</div>`;
    }
    const names = Object.keys(node.children).sort((a, b) => {
      const ad = node.children[a].type === "dir", bd = node.children[b].type === "dir";
      if (ad !== bd) return ad ? -1 : 1;
      return a.localeCompare(b);
    });
    if (names.length === 0) return `<div class="out dim">(empty)</div>`;
    const rendered = names.map((n) => {
      const child = node.children[n];
      return child.type === "dir"
        ? `<span class="c-cyan">${Utils.escapeHtml(n)}/</span>`
        : `<span class="c-white">${Utils.escapeHtml(n)}</span>`;
    }).join("&nbsp;&nbsp;&nbsp;");
    return `<div class="out">${rendered}</div>`;
  }

  tree(arg) {
    const target = arg ? PathResolver.resolve(this.cwd, arg) : this.cwd;
    const node = VFS.getNode(target);
    if (!node) return `<div class="out c-red">tree: ${Utils.escapeHtml(arg)}: No such file or directory</div>`;
    if (node.type !== "dir") return `<div class="out c-red">tree: ${Utils.escapeHtml(arg)}: not a directory</div>`;

    const lines = [PathResolver.display(target)];
    let dirCount = 0, fileCount = 0;

    const walk = (n, prefix) => {
      const names = Object.keys(n.children).sort((a, b) => {
        const ad = n.children[a].type === "dir", bd = n.children[b].type === "dir";
        if (ad !== bd) return ad ? -1 : 1;
        return a.localeCompare(b);
      });
      names.forEach((name, i) => {
        const isLast = i === names.length - 1;
        const child = n.children[name];
        const branch = isLast ? "└── " : "├── ";
        if (child.type === "dir") {
          dirCount++;
          lines.push(prefix + branch + name + "/");
          walk(child, prefix + (isLast ? "    " : "│   "));
        } else {
          fileCount++;
          lines.push(prefix + branch + name);
        }
      });
    };
    walk(node, "");
    lines.push("");
    lines.push(`${dirCount} directories, ${fileCount} files`);
    return `<div class="out ascii">${Utils.escapeHtml(lines.join("\n"))}</div>`;
  }

  cat(arg) {
    if (!arg) return `<div class="out c-yellow">usage: cat &lt;file&gt;</div>`;
    const target = PathResolver.resolve(this.cwd, arg);
    const node = VFS.getNode(target);
    if (!node) return `<div class="out c-red">cat: ${Utils.escapeHtml(arg)}: No such file or directory</div>`;
    if (node.type === "dir") return `<div class="out c-red">cat: ${Utils.escapeHtml(arg)}: Is a directory</div>`;
    if (node.kind === "binary") return `<div class="out c-yellow">cat: ${Utils.escapeHtml(arg)}: Is a binary file.<br><span class="dim">${Utils.escapeHtml(node.hint || "")}</span></div>`;
    return FileReader_.read(node, PathResolver.display(target));
  }

  /* used by autocomplete: children of an arbitrary resolved dir */
  childrenAt(pathArg) {
    const target = pathArg ? PathResolver.resolve(this.cwd, pathArg) : this.cwd;
    const node = VFS.getNode(target);
    return node && node.type === "dir" ? node.children : null;
  }
}

/* =====================================================================
   MODULE: PARSER
   ===================================================================== */
const Parser = (() => {
  const normalize = (raw) => raw.trim().replace(/\s+/g, " ");

  function parse(raw) {
    const input = normalize(raw);
    if (input === "") return { spec: null, args: [], input };
    const lower = input.toLowerCase();

    let spec = CommandRegistry.get(lower);
    if (spec) return { spec, args: [], input };

    const tokens = lower.split(" ");
    for (let len = tokens.length - 1; len >= 1; len--) {
      const prefix = tokens.slice(0, len).join(" ");
      spec = CommandRegistry.get(prefix);
      if (spec) {
        const argTokens = input.split(" ").slice(len);
        return { spec, args: argTokens, input };
      }
    }

    const first = tokens[0];
    spec = CommandRegistry.get(first);
    if (spec) {
      const argTokens = input.split(" ").slice(1);
      return { spec, args: argTokens, input };
    }
    return { spec: null, args: [], input };
  }

  function suggest(input) {
    const lower = input.toLowerCase().split(" ")[0];
    const candidates = CommandRegistry.visibleNames().map((n) => n.split(" ")[0]);
    let best = null, bestDist = Infinity;
    for (const c of candidates) {
      const d = Utils.levenshtein(lower, c);
      if (d < bestDist) { bestDist = d; best = c; }
    }
    return bestDist <= 2 ? best : null;
  }

  return { parse, suggest, normalize };
})();

/* =====================================================================
   MODULE: HISTORY MANAGER
   ===================================================================== */
class HistoryManager {
  constructor() { this.items = []; this.pos = -1; }
  push(cmd) { this.items.push(cmd); this.pos = this.items.length; }
  prev() { if (this.items.length === 0) return null; this.pos = Math.max(0, this.pos - 1); return this.items[this.pos] ?? null; }
  next() { if (this.items.length === 0) return ""; this.pos = Math.min(this.items.length, this.pos + 1); return this.items[this.pos] ?? ""; }
  get length() { return this.items.length; }
}

/* =====================================================================
   MODULE: AUTOCOMPLETE ENGINE
   Filesystem-aware: completes command names for the first token, and
   folder/file names (from the live VFS, relative to cwd) for the
   second token of cd / ls / cat / tree.
   ===================================================================== */
const AutocompleteEngine = (() => {
  const FS_AWARE_CMDS = new Set(["cd", "ls", "cat", "tree"]);

  function splitLastSegment(token) {
    const idx = token.lastIndexOf("/");
    if (idx === -1) return { dirPart: "", prefix: token };
    return { dirPart: token.slice(0, idx), prefix: token.slice(idx + 1) };
  }

  function candidatesFor(cmd, token, nav) {
    const { dirPart, prefix } = splitLastSegment(token);
    const children = nav.childrenAt(dirPart || "");
    if (!children) return [];
    let names = Object.keys(children);
    if (cmd === "cd") names = names.filter((n) => children[n].type === "dir");
    if (cmd === "cat") names = names.filter((n) => children[n].type === "file");
    return names
      .filter((n) => n.toLowerCase().startsWith(prefix.toLowerCase()))
      .map((n) => (dirPart ? dirPart + "/" : "") + n + (children[n].type === "dir" ? "/" : ""));
  }

  function suggestions(inputRaw, nav) {
    const trimmed = inputRaw;
    const tokens = trimmed.split(" ");
    if (tokens.length <= 1) {
      const partial = (tokens[0] || "").toLowerCase();
      if (!partial) return [];
      return CommandRegistry.visibleNames().filter((n) => n.startsWith(partial));
    }
    const cmd = tokens[0].toLowerCase();
    if (!FS_AWARE_CMDS.has(cmd)) return [];
    const lastToken = tokens[tokens.length - 1];
    return candidatesFor(cmd, lastToken, nav);
  }

  /** single best inline ghost completion (for the faint preview text) */
  function ghostFor(inputRaw, nav) {
    const matches = suggestions(inputRaw, nav);
    if (matches.length === 0) return "";
    const tokens = inputRaw.split(" ");
    if (tokens.length <= 1) {
      const shortest = matches.slice().sort((a, b) => a.length - b.length)[0];
      return shortest;
    }
    const head = tokens.slice(0, -1).join(" ");
    const best = matches.slice().sort((a, b) => a.length - b.length)[0];
    return `${head} ${best}`;
  }

  return { suggestions, ghostFor };
})();

/* =====================================================================
   MODULE: MATRIX RAIN
   ===================================================================== */
const MatrixRain = (() => {
  const canvas = document.getElementById("matrix-canvas");
  const ctx = canvas.getContext("2d");
  let raf = null, cols = [];
  const chars = "01アイウエオカキクケコ$#@&%".split("");

  function resize() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const fontSize = 15;
    cols = new Array(Math.floor(canvas.width / fontSize)).fill(0);
  }
  function frame() {
    ctx.fillStyle = "rgba(9,9,9,0.12)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--green").trim() || "#39d97a";
    ctx.font = "15px monospace";
    cols.forEach((y, i) => {
      const text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(text, i * 15, y);
      if (y > canvas.height && Math.random() > 0.975) cols[i] = 0; else cols[i] = y + 15;
    });
    raf = requestAnimationFrame(frame);
  }
  function setActive(on) {
    if (on) { canvas.style.display = "block"; resize(); if (!raf) raf = requestAnimationFrame(frame); }
    else { canvas.style.display = "none"; if (raf) cancelAnimationFrame(raf); raf = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  window.addEventListener("resize", () => { if (canvas.style.display === "block") resize(); });
  return { setActive };
})();

/* =====================================================================
   MODULE: TERMINAL ENGINE
   ===================================================================== */
class TerminalEngine {
  constructor() {
    this.screen = document.getElementById("screen");
    this.input = document.getElementById("cmd-input");
    this.ghost = document.getElementById("ghost");
    this.promptLabel = document.getElementById("prompt-label");
    this.uptimeEl = document.getElementById("tb-uptime");

    this.nav = new DirectoryNavigator();
    this.historyMgr = new HistoryManager();
    this.locked = false;
    this.startTime = Date.now();
    this.matrixOn = false;
    this.blockCounter = 0;
    this.theme = "green";

    this.renderPrompt();
    this.bindEvents();
    setInterval(() => this.updateUptime(), 1000);
  }

  get history() { return this.historyMgr.items; }

  uptimeMs() { return Date.now() - this.startTime; }
  updateUptime() { this.uptimeEl.textContent = Utils.formatUptime(this.uptimeMs()); }

  renderPrompt() {
    this.promptLabel.innerHTML =
      `<span class="p-user">harish</span><span class="p-at">@</span><span class="p-host">cloud</span>:<span class="p-path">${Utils.escapeHtml(this.nav.promptPath())}</span><span class="p-dollar">$</span>&nbsp;`;
    const titlePath = document.querySelector(".tb-title");
    if (titlePath) titlePath.innerHTML = `<b>harish@cloud</b>: ${Utils.escapeHtml(this.nav.promptPath())} — 80x24`;
  }

  print(html) {
    const div = document.createElement("div");
    div.innerHTML = html;
    this.screen.appendChild(div);
    this.scrollToEnd();
  }

  printEcho(commandText) {
    const div = document.createElement("div");
    div.className = "line echo";
    div.innerHTML = `<span class="prompt-seg">harish@cloud</span>:<span class="path-seg">${Utils.escapeHtml(this.nav.promptPath())}</span>$ ${Utils.escapeHtml(commandText)}`;
    this.screen.appendChild(div);
    this.scrollToEnd();
  }

  newOutputBlock() {
    this.blockCounter += 1;
    const id = `blk-${this.blockCounter}`;
    const div = document.createElement("div");
    div.className = "out"; div.id = id;
    this.screen.appendChild(div);
    this.scrollToEnd();
    return id;
  }
  appendToBlock(id, html) { const el = document.getElementById(id); if (el) el.insertAdjacentHTML("beforeend", html); this.scrollToEnd(); }
  replaceBlock(id, html) { const el = document.getElementById(id); if (el) el.innerHTML = html; this.scrollToEnd(); }

  clearScreen() { this.screen.innerHTML = ""; }
  scrollToEnd() { this.screen.scrollTop = this.screen.scrollHeight; }

  lockInput() { this.locked = true; this.input.disabled = true; this.input.placeholder = ""; }

  setTheme(t) {
    this.theme = t;
    if (t === "green") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
  }
  cycleTheme() {
    const order = ["green", "blue", "amber"];
    const next = order[(order.indexOf(this.theme) + 1) % order.length];
    this.setTheme(next);
    this.print(`<div class="out c-green">Theme switched to '${next}'.</div>`);
  }
  toggleMatrix() { this.matrixOn = !this.matrixOn; MatrixRain.setActive(this.matrixOn); return this.matrixOn; }

  async runInitial(cmd) { await this.execute(cmd, { silentEcho: true }); }

  async execute(raw, opts = {}) {
    if (!opts.silentEcho) this.printEcho(raw);
    if (raw.trim() === "") return;

    this.historyMgr.push(raw.trim());
    const { spec, args } = Parser.parse(raw);

    if (!spec) {
      const suggestion = Parser.suggest(raw.trim());
      this.print(`<div class="out c-red">command not found: ${Utils.escapeHtml(raw.trim().split(" ")[0])}${
        suggestion ? `<br><span class="dim">Did you mean '<b class="c-yellow">${Utils.escapeHtml(suggestion)}</b>'?</span>` : `<br><span class="dim">type 'help' to see available commands</span>`
      }</div>`);
      return;
    }
    try {
      const result = await spec.handler(args, this);
      if (result) this.print(result);
    } catch (err) {
      this.print(`<div class="out c-red">internal error: ${Utils.escapeHtml(String(err && err.message ? err.message : err))}</div>`);
    }
  }

  bindEvents() {
    this.input.addEventListener("keydown", (e) => this.onKeyDown(e));
    this.input.addEventListener("input", () => this.updateGhost());
    document.addEventListener("keydown", (e) => { if (e.ctrlKey && (e.key === "l" || e.key === "L")) { e.preventDefault(); this.clearScreen(); } });
    this.screen.addEventListener("click", () => this.input.focus());
    document.getElementById("terminal").addEventListener("click", () => this.input.focus());
  }

  updateGhost() {
    const val = this.input.value;
    if (!val) { this.ghost.textContent = ""; return; }
    const g = AutocompleteEngine.ghostFor(val, this.nav);
    this.ghost.textContent = g && g.toLowerCase() !== val.toLowerCase() ? g : "";
  }

  onKeyDown(e) {
    if (this.locked) { e.preventDefault(); return; }

    if (e.key === "Enter") {
      e.preventDefault();
      const val = this.input.value;
      this.input.value = ""; this.ghost.textContent = "";
      this.execute(val);
      return;
    }
    if (e.key === "Tab") {
      e.preventDefault();
      const val = this.input.value;
      if (!val.trim()) return;
      const matches = AutocompleteEngine.suggestions(val, this.nav);
      if (matches.length === 1) {
        const tokens = val.split(" ");
        tokens[tokens.length - 1] = matches[0];
        this.input.value = tokens.join(" ") + (tokens.length === 1 ? " " : "");
      } else if (matches.length > 1) {
        this.print(`<div class="out dim">${matches.map(Utils.escapeHtml).join("&nbsp;&nbsp; ")}</div>`);
      }
      this.updateGhost();
      return;
    }
    if (e.key === "ArrowRight" && this.input.selectionStart === this.input.value.length && this.ghost.textContent) {
      this.input.value = this.ghost.textContent; this.ghost.textContent = ""; return;
    }
    if (e.key === "ArrowUp") { e.preventDefault(); const v = this.historyMgr.prev(); if (v !== null) this.input.value = v; this.updateGhost(); return; }
    if (e.key === "ArrowDown") { e.preventDefault(); this.input.value = this.historyMgr.next(); this.updateGhost(); return; }
  }
}

/* =====================================================================
   MODULE: BOOT SEQUENCE
   ===================================================================== */
const BootSequence = (() => {
  const logEl = document.getElementById("boot-log");
  const bootScreen = document.getElementById("boot-screen");
  const terminalEl = document.getElementById("terminal");
  const skipBtn = document.getElementById("boot-skip");

  const steps = [
    { t: "0.000000", text: "HarishOS Kernel 6.9.0-devops-cloud booting on x86_64...", cls: "boot-dim" },
    { t: "0.142013", text: "Initializing DevOps Portfolio kernel modules", bar: true },
    { t: "0.389442", text: "Loading AWS modules", ok: true },
    { t: "0.612205", text: "Loading Kubernetes control plane", ok: true },
    { t: "0.844471", text: "Starting Docker Engine", ok: true },
    { t: "1.021982", text: "Loading Terraform providers", ok: true },
    { t: "1.256730", text: "Mounting virtual filesystem at /home/harish", ok: true },
    { t: "1.498120", text: "Establishing secure connection to github.com", ok: true },
    { t: "1.723300", text: "Starting DevSecOps toolchain (sonarqube, trivy)", ok: true },
    { t: "1.982211", text: "Starting observability stack (prometheus, grafana)", ok: true },
    { t: "2.201044", text: "Bringing up network interface eth0... ", ok: true, extra: "192.168.10.74/24" },
    { t: "2.410932", text: "Starting shell", ok: true },
  ];

  function lineHTML(step) {
    const tag = `<span class="boot-dim">[</span><span class="c-cyan">${step.t}</span><span class="boot-dim">]</span>`;
    if (step.ok) return `${tag} ${step.text}${step.extra ? `<span class="boot-dim"> ${step.extra}</span>` : ""} <span class="boot-ok">[  OK  ]</span>`;
    return `${tag} ${step.text}`;
  }

  async function run() {
    let skipped = false;
    const onSkip = () => { skipped = true; };
    skipBtn.addEventListener("click", onSkip);

    for (const step of steps) {
      if (skipped) break;
      const div = document.createElement("div");
      div.className = "boot-line";
      logEl.appendChild(div);
      if (step.bar) {
        div.innerHTML = `<span class="boot-dim">[</span><span class="c-cyan">${step.t}</span><span class="boot-dim">]</span> ${step.text}<span class="boot-bar-track"><span class="boot-bar-fill"></span></span>`;
        const fill = div.querySelector(".boot-bar-fill");
        for (let p = 0; p <= 100 && !skipped; p += 20) { fill.style.width = p + "%"; await Utils.sleep(45); }
      } else {
        div.innerHTML = lineHTML(step);
        await Utils.sleep(skipped ? 0 : 130);
      }
    }
    if (!skipped) await Utils.sleep(280);

    const welcome = document.createElement("div");
    welcome.className = "boot-line";
    welcome.style.marginTop = "18px";
    welcome.innerHTML =
      `<pre class="ascii a-cyan" style="font-size:11px;">` +
      `██╗  ██╗ █████╗ ██████╗ ██╗███████╗██╗  ██╗\n` +
      `██║  ██║██╔══██╗██╔══██╗██║██╔════╝██║  ██║\n` +
      `███████║███████║██████╔╝██║███████╗███████║\n` +
      `██╔══██║██╔══██║██╔══██╗██║╚════██║██╔══██║\n` +
      `██║  ██║██║  ██║██║  ██║██║███████║██║  ██║\n` +
      `╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝╚═╝╚══════╝╚═╝  ╚═╝` +
      `</pre>` +
      `<div class="c-white" style="margin-top:6px;">Welcome, Harish Kumar S — <span class="c-cyan">Cloud &amp; DevOps Engineer</span></div>` +
      `<div class="boot-ok">System Ready.</div>`;
    logEl.appendChild(welcome);
    await Utils.sleep(skipped ? 60 : 500);

    skipBtn.removeEventListener("click", onSkip);
    bootScreen.classList.add("hidden");
    terminalEl.style.display = "flex";
    return skipped;
  }

  return { run };
})();

/* =====================================================================
   MODULE: APP BOOTSTRAP
   ===================================================================== */
(async function init() {
  await BootSequence.run();

  const term = new TerminalEngine();
  window.__term = term;

  document.getElementById("btn-theme").addEventListener("click", () => term.cycleTheme());
  document.getElementById("btn-matrix").addEventListener("click", () => {
    const on = term.toggleMatrix();
    term.print(`<div class="out c-green">Matrix rain ${on ? "enabled" : "disabled"}.</div>`);
  });

  term.print(`<div class="out">
    <p>Type <b class="c-yellow">help</b> to see available commands, or <b class="c-yellow">whoami</b> to start with who I am.</p>
    <p class="dim">This is a real virtual filesystem — try <b class="c-yellow">cd about</b> then <b class="c-yellow">ls</b> then <b class="c-yellow">cat about.txt</b>.</p>
    <p class="dim">Tab autocompletes files &amp; folders too · ↑/↓ browse history · Ctrl+L clears the screen</p>
  </div>`);
  await term.runInitial("neofetch");
  term.input.focus();

  const observer = new MutationObserver(() => {
    document.querySelectorAll(".skillbar-fill:not([data-done])").forEach((el) => {
      el.setAttribute("data-done", "1");
      requestAnimationFrame(() => { el.style.width = el.dataset.target + "%"; });
    });
  });
  observer.observe(document.getElementById("screen"), { childList: true, subtree: true });
})();
</script>
