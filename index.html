/* =====================================================================
   MODULE: UTILS
   Small stateless helpers shared across every other module.
   ===================================================================== */
const Utils = (() => {
  const sleep = (ms) => new Promise((res) => setTimeout(res, ms));

  const escapeHtml = (str) =>
    String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

  // Levenshtein distance — used for "did you mean" suggestions
  const levenshtein = (a, b) => {
    const m = a.length, n = b.length;
    const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
    for (let j = 0; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        d[i][j] = a[i - 1] === b[j - 1]
          ? d[i - 1][j - 1]
          : 1 + Math.min(d[i - 1][j], d[i][j - 1], d[i - 1][j - 1]);
      }
    }
    return d[m][n];
  };

  const pad = (str, len) => (str + " ".repeat(len)).slice(0, len);

  const formatUptime = (ms) => {
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return `${h}h ${m}m ${sec}s`;
    if (m > 0) return `${m}m ${sec}s`;
    return `${sec}s`;
  };

  const copyToClipboard = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      return false;
    }
  };

  const randomOf = (arr) => arr[Math.floor(Math.random() * arr.length)];

  return { sleep, escapeHtml, levenshtein, pad, formatUptime, copyToClipboard, randomOf };
})();

/* =====================================================================
   MODULE: COMMAND REGISTRY
   The single source of truth for every command: its description
   (shown in `help`), and its handler. Handlers receive (args, term)
   and return either a string of HTML, an object {html}, or null
   (if they already wrote output themselves, e.g. `clear`).
   ===================================================================== */
const CommandRegistry = (() => {
  const registry = new Map(); // key: command signature string -> spec

  function register(spec) {
    registry.set(spec.name, spec);
  }

  const esc = Utils.escapeHtml;
  const D = PortfolioData;

  /* ---- core / filesystem-flavored commands ---- */

  register({
    name: "help",
    aliases: ["?"],
    usage: "help [--all]",
    hidden: false,
    description: "List available commands",
    handler: (args) => {
      const all = args.includes("--all");
      const groups = [
        { title: "core", cmds: [
          ["help [--all]", "show this list (--all adds descriptions for every command)"],
          ["whoami", "who I am, in one screen"],
          ["pwd", "print working directory"],
          ["ls", "list portfolio sections"],
          ["tree", "show the full folder hierarchy"],
          ["clear / Ctrl+L", "clear the screen"],
          ["history", "show your command history"],
          ["date", "current date & time"],
          ["echo <text>", "print text back"],
        ]},
        { title: "content", cmds: [
          ["cat about.txt", "professional summary & mission"],
          ["cat skills.txt", "animated skill bars"],
          ["cat experience.txt", "work experience timeline"],
          ["cat certifications.txt", "certifications list"],
          ["cat contact.txt", "how to reach me"],
          ["cat education.txt", "academic background"],
          ["projects", "list all projects"],
          ["project <n>", "full case study for project n (1-5)"],
          ["resume", "download my resume (PDF)"],
          ["github", "open my GitHub profile"],
          ["linkedin", "open my LinkedIn profile"],
        ]},
        { title: "system", cmds: [
          ["neofetch", "system info banner"],
          ["theme <green|blue|amber>", "switch color theme"],
          ["matrix", "toggle matrix rain background"],
          ["exit", "end the session"],
        ]},
      ];
      let html = `<div class="out"><p class="c-cyan">Available commands${all ? " (full reference)" : ""}:</p>`;
      groups.forEach((g) => {
        html += `<p class="dim" style="margin:10px 0 2px;"># ${g.title}</p><div class="help-grid">`;
        g.cmds.forEach(([cmd, desc]) => {
          html += `<span class="cmd">${esc(cmd)}</span><span class="desc">${esc(desc)}</span>`;
        });
        html += `</div>`;
      });
      if (!all) {
        html += `<p class="dim" style="margin-top:10px;">tip: run <span class="c-yellow">help --all</span>, or just start typing and press <b>Tab</b> — there are a few hidden commands too 👀</p>`;
      }
      html += `</div>`;
      return html;
    },
  });

  register({
    name: "whoami",
    usage: "whoami",
    description: "Who I am, in one screen",
    handler: () => `<div class="out">
      <p><b class="c-white">${esc(D.identity.name)}</b><br>
      <span class="c-cyan">${esc(D.identity.role)}</span></p>

  });

  register({
    name: "pwd",
    usage: "pwd",
    description: "Print working directory",

  register({
    name: "ls",

├── about/
│   └── about.txt
├── skills/
│   └── skills.txt
├── experience/
│   └── experience.txt

├── projects/
│   ├── 1-devsecops-cicd-pipeline/

/* =====================================================================
   MODULE: PARSER
   Turns raw input into a matched command spec + args. Commands can be
   multi-word ("git status", "sudo hire-me"); the parser tries the
   longest possible match against the registry before falling back to
   single-word-command-plus-arguments.
   ===================================================================== */
const Parser = (() => {
  const normalize = (raw) => raw.trim().replace(/\s+/g, " ");

  function parse(raw) {
    const input = normalize(raw);
    if (input === "") return { spec: null, args: [], input };

    const lower = input.toLowerCase();

    // 1) exact whole-string match (covers multi-word commands & 0-arg commands)
    let spec = CommandRegistry.get(lower);
    if (spec) return { spec, args: [], input };

    // 2) special-case: "cat <file>" — match "cat X" against "cat X" keys directly
    //    (already covered by exact match above since files are fixed names)

    // 3) try progressively shorter prefixes for multi-word commands with args
    //    e.g. "project 3" -> spec "project", args ["3"]
    const tokens = lower.split(" ");
    for (let len = tokens.length - 1; len >= 1; len--) {
      const prefix = tokens.slice(0, len).join(" ");
      spec = CommandRegistry.get(prefix);
      if (spec) {
        const argTokens = input.split(" ").slice(len);
        return { spec, args: argTokens, input };
      }
    }

    // 4) single first-word command (echo, unknown, etc.)
    const first = tokens[0];
    spec = CommandRegistry.get(first);
    if (spec) {
      const argTokens = input.split(" ").slice(1);
      return { spec, args: argTokens, input };
    }

    return { spec: null, args: [], input };
  }

  function suggest(input) {
    const lower = input.toLowerCase();
    const candidates = CommandRegistry.visibleNames();
    let best = null, bestDist = Infinity;
    for (const c of candidates) {
      const d = Utils.levenshtein(lower, c);
      if (d < bestDist) { bestDist = d; best = c; }
    }
    return bestDist <= 3 ? best : null;
  }

  return { parse, suggest, normalize };
})();

/* =====================================================================
   MODULE: TERMINAL ENGINE
   Owns DOM state for the shell: printing, prompt, history, matrix
   toggle, theming, uptime, and command execution.
   ===================================================================== */
class TerminalEngine {
  constructor() {
    this.screen = document.getElementById("screen");
    this.input = document.getElementById("cmd-input");
    this.ghost = document.getElementById("ghost");
    this.promptLabel = document.getElementById("prompt-label");
    this.uptimeEl = document.getElementById("tb-uptime");

    this.history = [];
    this.historyPos = -1;
    this.locked = false;
    this.startTime = Date.now();
    this.matrixOn = false;
    this.blockCounter = 0;
    this.theme = "green";

    this.renderPrompt();
    this.bindEvents();
    setInterval(() => this.updateUptime(), 1000);
  }

  uptimeMs() { return Date.now() - this.startTime; }
  updateUptime() { this.uptimeEl.textContent = `uptime ${Utils.formatUptime(this.uptimeMs())}`; }

  renderPrompt() {
    this.promptLabel.innerHTML =
      `<span class="p-user">harish</span><span class="p-at">@</span><span class="p-host">cloud</span>:<span class="p-path">~/portfolio</span><span class="p-dollar">$</span>&nbsp;`;
  }

  print(html) {
    const div = document.createElement("div");
    div.innerHTML = html;
    this.screen.appendChild(div);
    this.scrollToEnd();
  }

  printEcho(commandText) {
    const div = document.createElement("div");
    div.className = "line echo";
    div.innerHTML =
      `<span class="prompt-seg">harish@cloud</span>:<span class="path-seg">~/portfolio</span>$ ${Utils.escapeHtml(commandText)}`;
    this.screen.appendChild(div);
    this.scrollToEnd();
  }

  newOutputBlock() {
    this.blockCounter += 1;
    const id = `blk-${this.blockCounter}`;
    const div = document.createElement("div");
    div.className = "out";
    div.id = id;
    this.screen.appendChild(div);
    this.scrollToEnd();
    return id;
  }

  appendToBlock(id, html) {
    const el = document.getElementById(id);
    if (el) el.insertAdjacentHTML("beforeend", html);
    this.scrollToEnd();
  }

  clearScreen() { this.screen.innerHTML = ""; }

  scrollToEnd() { this.screen.scrollTop = this.screen.scrollHeight; }

  lockInput() {
    this.locked = true;
    this.input.disabled = true;
    this.input.placeholder = "";
  }

  setTheme(t) {
    this.theme = t;
    if (t === "green") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
  }

  cycleTheme() {
    const order = ["green", "blue", "amber"];
    const next = order[(order.indexOf(this.theme) + 1) % order.length];
    this.setTheme(next);
    this.print(`<div class="out c-green">Theme switched to '${next}'.</div>`);
  }

  toggleMatrix() {
    this.matrixOn = !this.matrixOn;
    MatrixRain.setActive(this.matrixOn);
    return this.matrixOn;
  }

  async runInitial(cmd) {
    await this.execute(cmd, { silentEcho: true });
  }

  async execute(raw, opts = {}) {
    const trimmed = raw;
    if (!opts.silentEcho) this.printEcho(trimmed);
    if (trimmed.trim() === "") return;

    this.history.push(trimmed.trim());
    this.historyPos = this.history.length;

    const { spec, args } = Parser.parse(trimmed);

    if (!spec) {
      const suggestion = Parser.suggest(trimmed.trim());
      this.print(
        `<div class="out c-red">command not found: ${Utils.escapeHtml(trimmed.trim())}${
          suggestion ? `<br><span class="dim">Did you mean '<b class="c-yellow">${Utils.escapeHtml(suggestion)}</b>'?</span>` : `<br><span class="dim">type 'help' to see available commands</span>`
        }</div>`
      );
      return;
    }

    try {
      const result = await spec.handler(args, this);
      if (result) this.print(result);
    } catch (err) {
      this.print(`<div class="out c-red">internal error: ${Utils.escapeHtml(String(err && err.message ? err.message : err))}</div>`);
    }
  }

  /* ---- input event wiring: autocomplete, history, shortcuts ---- */
  bindEvents() {
    this.input.addEventListener("keydown", (e) => this.onKeyDown(e));
    this.input.addEventListener("input", () => this.updateGhost());
    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey && (e.key === "l" || e.key === "L")) {
        e.preventDefault();
        this.clearScreen();
      }
    });
    this.screen.addEventListener("click", () => this.input.focus());
    document.getElementById("terminal").addEventListener("click", () => this.input.focus());
  }

  updateGhost() {
    const val = this.input.value;
    if (!val) { this.ghost.textContent = ""; return; }
    const match = CommandRegistry.visibleNames()
      .filter((n) => n.startsWith(val.toLowerCase()) && n !== val.toLowerCase())
      .sort((a, b) => a.length - b.length)[0];
    this.ghost.textContent = match ? match : "";
  }

  onKeyDown(e) {
    if (this.locked) { e.preventDefault(); return; }

    if (e.key === "Enter") {
      e.preventDefault();
      const val = this.input.value;
      this.input.value = "";
      this.ghost.textContent = "";
      this.execute(val);
      return;
    }

    if (e.key === "Tab") {
      e.preventDefault();
      const val = this.input.value.trim().toLowerCase();
      if (!val) return;
      const matches = CommandRegistry.visibleNames().filter((n) => n.startsWith(val));
      if (matches.length === 1) {
        this.input.value = matches[0] + " ";
      } else if (matches.length > 1) {
        this.print(`<div class="out dim">${matches.map(Utils.escapeHtml).join("&nbsp;&nbsp; ")}</div>`);
      }
      this.updateGhost();
      return;
    }

    if (e.key === "ArrowRight" && this.input.selectionStart === this.input.value.length && this.ghost.textContent) {
      this.input.value = this.ghost.textContent;
      this.ghost.textContent = "";
      return;
    }

    if (e.key === "ArrowUp") {
      e.preventDefault();
      if (this.history.length === 0) return;
      this.historyPos = Math.max(0, this.historyPos - 1);
      this.input.value = this.history[this.historyPos] || "";
      this.updateGhost();
      return;
    }

    if (e.key === "ArrowDown") {
      e.preventDefault();
      if (this.history.length === 0) return;
      this.historyPos = Math.min(this.history.length, this.historyPos + 1);
      this.input.value = this.history[this.historyPos] || "";
      this.updateGhost();
      return;
    }
  }
}

/* =====================================================================
   MODULE: MATRIX RAIN (bonus, off by default, subtle when on)
   ===================================================================== */
const MatrixRain = (() => {
  const canvas = document.getElementById("matrix-canvas");
  const ctx = canvas.getContext("2d");
  let raf = null;
  let cols = [];
  const chars = "01アイウエオカキクケコ$#@&%".split("");

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const fontSize = 15;
    const count = Math.floor(canvas.width / fontSize);
    cols = new Array(count).fill(0);
  }

  function frame() {
    ctx.fillStyle = "rgba(9,9,9,0.12)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--green").trim() || "#39d97a";
    ctx.font = "15px monospace";
    cols.forEach((y, i) => {
      const text = chars[Math.floor(Math.random() * chars.length)];
      const x = i * 15;
      ctx.fillText(text, x, y);
      if (y > canvas.height && Math.random() > 0.975) cols[i] = 0;
      else cols[i] = y + 15;
    });
    raf = requestAnimationFrame(frame);
  }

  function setActive(on) {
    if (on) {
      canvas.style.display = "block";
      resize();
      if (!raf) raf = requestAnimationFrame(frame);
    } else {
      canvas.style.display = "none";
      if (raf) cancelAnimationFrame(raf);
      raf = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  window.addEventListener("resize", () => { if (canvas.style.display === "block") resize(); });

  return { setActive };
})();

/* =====================================================================
   MODULE: BOOT SEQUENCE
   Simulated Linux boot, then hands off to the TerminalEngine.
   ===================================================================== */
const BootSequence = (() => {
  const logEl = document.getElementById("boot-log");
  const bootScreen = document.getElementById("boot-screen");
  const terminalEl = document.getElementById("terminal");
  const skipBtn = document.getElementById("boot-skip");

  const steps = [
    { t: "0.000000", text: "HarishOS Kernel 6.9.0-devops-cloud booting on x86_64...", cls: "boot-dim" },
    { t: "0.142013", text: "Initializing DevOps Portfolio kernel modules", bar: true },
    { t: "0.389442", text: "Loading AWS modules", ok: true },
    { t: "0.612205", text: "Loading Kubernetes control plane", ok: true },
    { t: "0.844471", text: "Starting Docker Engine", ok: true },
    { t: "1.021982", text: "Loading Terraform providers", ok: true },
    { t: "1.256730", text: "Mounting Git filesystem at /home/harish", ok: true },
    { t: "1.498120", text: "Establishing secure connection to github.com", ok: true },
    { t: "1.723300", text: "Starting DevSecOps toolchain (sonarqube, trivy)", ok: true },
    { t: "1.982211", text: "Starting observability stack (prometheus, grafana)", ok: true },
    { t: "2.201044", text: "Bringing up network interface eth0... ", ok: true, extra: "192.168.10.74/24" },
    { t: "2.410932", text: "Starting shell", ok: true },
  ];

  function lineHTML(step) {
    const tag = `<span class="boot-dim">[</span><span class="c-cyan">${step.t}</span><span class="boot-dim">]</span>`;
    if (step.ok) {
      return `${tag} ${step.text}${step.extra ? `<span class="boot-dim"> ${step.extra}</span>` : ""} <span class="boot-ok">[  OK  ]</span>`;
    }
    return `${tag} ${step.text}`;
  }

  async function run() {
    let skipped = false;
    const onSkip = () => { skipped = true; };
    skipBtn.addEventListener("click", onSkip);

    for (const step of steps) {
      if (skipped) break;
      const div = document.createElement("div");
      div.className = "boot-line";
      logEl.appendChild(div);

      if (step.bar) {
        div.innerHTML = `<span class="boot-dim">[</span><span class="c-cyan">${step.t}</span><span class="boot-dim">]</span> ${step.text}<span class="boot-bar-track"><span class="boot-bar-fill"></span></span>`;
        const fill = div.querySelector(".boot-bar-fill");
        for (let p = 0; p <= 100 && !skipped; p += 20) {
          fill.style.width = p + "%";
          await Utils.sleep(45);
        }
      } else {
        div.innerHTML = lineHTML(step);
        await Utils.sleep(skipped ? 0 : 130);
      }
    }

    if (!skipped) await Utils.sleep(280);

    const welcome = document.createElement("div");
    welcome.className = "boot-line";
    welcome.style.marginTop = "18px";
    welcome.innerHTML =
      `<pre class="ascii a-cyan" style="font-size:11px;">` +
      `██╗  ██╗ █████╗ ██████╗ ██╗███████╗██╗  ██╗\n` +
      `██║  ██║██╔══██╗██╔══██╗██║██╔════╝██║  ██║\n` +
      `███████║███████║██████╔╝██║███████╗███████║\n` +
      `██╔══██║██╔══██║██╔══██╗██║╚════██║██╔══██║\n` +
      `██║  ██║██║  ██║██║  ██║██║███████║██║  ██║\n` +
      `╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝╚═╝╚══════╝╚═╝  ╚═╝` +
      `</pre>` +
      `<div class="c-white" style="margin-top:6px;">Welcome, Harish Kumar S — <span class="c-cyan">Cloud &amp; DevOps Engineer</span></div>` +
      `<div class="boot-ok">System Ready.</div>`;
    logEl.appendChild(welcome);
    await Utils.sleep(skipped ? 60 : 500);

    skipBtn.removeEventListener("click", onSkip);
    bootScreen.classList.add("hidden");
    terminalEl.style.display = "flex";

    return skipped;
  }

  return { run };
})();

/* =====================================================================
   MODULE: APP BOOTSTRAP
   Wires everything together once the DOM is ready.
   ===================================================================== */
(async function init() {
  await BootSequence.run();

  const term = new TerminalEngine();
  window.__term = term; // handy for debugging in devtools

  // Titlebar buttons
  document.getElementById("btn-theme").addEventListener("click", () => term.cycleTheme());
  document.getElementById("btn-matrix").addEventListener("click", () => {
    const on = term.toggleMatrix();
    term.print(`<div class="out c-green">Matrix rain ${on ? "enabled" : "disabled"}.</div>`);
  });

  // Intro output, then focus input
  term.print(`<div class="out">
    <p>Type <b class="c-yellow">help</b> to see available commands, or <b class="c-yellow">whoami</b> to start with who I am.</p>
    <p class="dim">Tab autocompletes · ↑/↓ browse history · Ctrl+L clears the screen</p>
  </div>`);
  await term.runInitial("neofetch");
  term.input.focus();

  // Animate skill bars whenever a skills.txt block enters the DOM
  const observer = new MutationObserver(() => {
    document.querySelectorAll(".skillbar-fill:not([data-done])").forEach((el) => {
      el.setAttribute("data-done", "1");
      requestAnimationFrame(() => { el.style.width = el.dataset.target + "%"; });
    });
  });
  observer.observe(document.getElementById("screen"), { childList: true, subtree: true });
})();
